# XcodeGen spec. Regenerate the project with:  cd ios-pfb && xcodegen generate
# ProFootballBoard.xcodeproj is gitignored and disposable; never hand-edit it.
name: ProFootballBoard
options:
  bundleIdPrefix: com.hoynelabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3V73W9NUZ6   # Hoyne Labs LLC
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ProFootballBoard:
    type: application
    platform: iOS
    sources:
      - path: ProFootballBoard
    dependencies:
      - target: ProFootballBoardWidget        # embedded in PlugIns
    scheme:
      testTargets:
        - ProFootballBoardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoynelabs.profootballboard
        PRODUCT_NAME: ProFootballBoard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
    info:
      path: ProFootballBoard/Info.plist
      properties:
        CFBundleDisplayName: Pro Football Board
        CFBundleName: ProFootballBoard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
        # pfb://board, ://live, ://following, ://about, ://game/<espn id>  (parsed in Model/Route.swift)
        CFBundleURLTypes:
          - CFBundleURLName: com.hoynelabs.profootballboard
            CFBundleURLSchemes: [pfb]

  # Home Screen widget: shares Model/ and Data/ with the app.
  ProFootballBoardWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ProFootballBoardWidget
      - path: ProFootballBoard/Model
      - path: ProFootballBoard/Data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoynelabs.profootballboard.widget
        PRODUCT_NAME: ProFootballBoardWidget
    info:
      path: ProFootballBoardWidget/Info.plist
      properties:
        CFBundleDisplayName: Pro Football Board
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Unit tests compile the shared model, data and widget layers directly (no host app).
  ProFootballBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProFootballBoardTests
      - path: ProFootballBoard/Model
      - path: ProFootballBoard/Data
      - path: ProFootballBoardWidget
        excludes:
          - WidgetBundle.swift
          - Info.plist
          - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoynelabs.profootballboard.tests
        GENERATE_INFOPLIST_FILE: YES
