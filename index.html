<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1220" />
  <title>CFB GameDay Board</title>
  <style>
    :root {
      --bg: #0b1220; --bg2: #111a2c; --card: #162036; --card2: #1b2740;
      --line: #2a3a5a; --text: #f4f7fb; --muted: #9aa8bf; --dim: #6e7c94;
      --gold: #e8c36a; --gold2: #f3d78a; --blue: #7eb6ff; --green: #5dcaa5;
      --red: #ff7a7a; --orange: #ffb060; --chip: #22314d; --purple: #c9b3ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
    body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
    header { position: sticky; top: 0; z-index: 30; background: rgba(11,18,32,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 12px 14px 8px; }
    .kicker { color: var(--gold); font-size: 11px; letter-spacing: .14em; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 2px 0 0; font-size: 22px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .rowscroll { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px; -webkit-overflow-scrolling: touch; }
    .rowscroll::-webkit-scrollbar { display: none; }
    .fbtn { flex: 0 0 auto; border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
    .fbtn.active { background: var(--gold); color: #1a1406; border-color: var(--gold); }
    .searchwrap { padding: 0 14px 8px; }
    input, select { width: 100%; background: var(--bg2); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 11px 12px; font-size: 15px; }
    select { width: auto; padding: 8px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 14px 10px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
    .stat b { display: block; font-size: 16px; color: var(--gold2); }
    .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .desk { padding: 0 14px 10px; }
    .desk h2 { margin: 4px 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
    .deskcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .deskcard .t { font-weight: 800; font-size: 14px; }
    .deskcard .d { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .04em; border-radius: 999px; padding: 3px 7px; margin-right: 6px; }
    .tag.under { background: #14263a; color: var(--blue); }
    .tag.watch { background: #3a2a12; color: var(--gold); }
    .tag.heat { background: #3a1b14; color: var(--orange); }
    .list { padding: 0 12px 48px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 12px 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .tv { color: var(--blue); }
    .star { background: none; border: 0; color: var(--dim); font-size: 18px; padding: 0 0 0 6px; }
    .star.on { color: var(--gold); }
    .teams { padding: 8px 12px 6px; display: grid; gap: 8px; }
    .trow { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; }
    .trow img { width: 28px; height: 28px; object-fit: contain; background: #0b1220; border-radius: 6px; }
    .name { font-weight: 700; font-size: 15px; line-height: 1.15; }
    .rank { color: var(--gold); font-weight: 800; margin-right: 4px; }
    .rec { color: var(--dim); font-size: 12px; font-weight: 600; margin-left: 6px; }
    .score { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; }
    .venue { padding: 2px 12px 8px; color: var(--muted); font-size: 12.5px; }
    .venue a { color: var(--blue); text-decoration: none; }
    .venue b { color: var(--text); }
    .wx { margin: 0 12px 10px; background: #10192b; border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 8px; }
    .wx .cond { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; }
    .wx .cond b { font-size: 20px; }
    .mini { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .val { font-size: 13px; font-weight: 700; }
    .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .odds { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 12px 10px; }
    .od { background: #10192b; border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
    .lab { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
    .big { font-size: 13px; font-weight: 800; margin-top: 2px; }
    .juice { font-size: 11px; color: var(--muted); }
    .actions { display: flex; gap: 8px; padding: 0 12px 12px; }
    .abtn { flex: 1; background: #10192b; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 700; }
    .flags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
    .flag { font-size: 10px; font-weight: 800; letter-spacing: .04em; border-radius: 999px; padding: 4px 8px; background: #3a2a12; color: var(--gold); }
    .flag.hot { background: #3a1b14; color: var(--orange); }
    .flag.rain { background: #14263a; color: var(--blue); }
    .flag.wind { background: #1c2a1c; color: var(--green); }
    .flag.indoor { background: #24183a; color: var(--purple); }
    .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
    footer { color: var(--dim); font-size: 11px; text-align: center; padding: 4px 16px 28px; line-height: 1.4; }
    @media (min-width: 900px) {
      .wrap { max-width: 1120px; margin: 0 auto; }
      .list { display: grid; grid-template-columns: 1fr 1fr; }
      .desk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    }
  
    .trow { display:grid; grid-template-columns:28px 1fr auto auto; gap:8px; align-items:center; }
    .impl { color:var(--gold2); font-size:12px; font-weight:700; }
    .section { padding:0 12px 20px; }
    .netblock { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
    .netgame b { font-weight:800; font-size:14px; }
    .netgame span { color:var(--muted); font-size:12px; margin-top:3px; display:block; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { text-align:left; color:var(--dim); font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--line); }
    td { padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
    .tag.alt { background:#1c2a1c; color:var(--green); }
    .list.cards { display:flex; flex-direction:column; gap:10px; }
    @media (min-width:900px) { .list.cards { display:grid; grid-template-columns:1fr 1fr; } }
    .card.is-live { border-color:#c9842a; }
    .livepill { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; border-radius:999px; padding:3px 7px; margin-right:6px; background:#3a1b14; color:var(--orange); }
    .livepill.final { background:#1c2a1c; color:var(--green); }
    .liverow { margin:8px 12px 0; background:#10192b; border:1px solid var(--line); border-radius:12px; padding:8px 10px; font-size:12px; }
    .livemath { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
    .livemath span { font-weight:800; font-size:11px; }
    .cover-home { color:var(--green); }
    .cover-away { color:var(--orange); }
    .cover-push { color:var(--gold); }
    .sit { color:var(--muted); margin-top:6px; line-height:1.35; }

  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">Week 1 · 2026</div>
      <h1>CFB GameDay Board</h1>
      <div class="sub" id="updated">Venue, weather, implied score, CT kickoff</div>
    </header>
    <div class="rowscroll" id="days"></div>
    <div class="searchwrap"><input id="q" type="search" placeholder="Search team, stadium, city, TV, conference…" /></div>
    <div class="rowscroll" id="views"></div>
    <div class="rowscroll" id="toggles"></div>
    <div class="rowscroll" id="windows"></div>
    <div class="stats" id="stats"></div>
    <div class="desk" id="desk"></div>
    <div id="main"></div>
    <footer>Run python3 server.py and open http://127.0.0.1:8765/ for live ESPN scores every 15s. Cover math uses the posted home spread vs current margin. Not betting advice.</footer>
  </div>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
