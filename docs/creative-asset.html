<!doctype html><html><head><meta charset="utf-8">
<!-- App Store universal creative asset (product page header + search results), 5244x2950 PNG, no alpha.
     Header crops to 21:9 (~351 px off top/bottom), search results to 3:2 (~410 px off each side):
     keep everything inside x 410-4834, y 351-2599. Apple's rules: 4+ content (no odds, spreads, totals),
     no URLs, prices, team names or other platforms' logos. Render (Canary, throwaway profile), then drop alpha:
     "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary" --headless=new --user-data-dir=$(mktemp -d) \
       --hide-scrollbars --force-device-scale-factor=1 --window-size=5244,2950 --screenshot=raw.png "file://$PWD/docs/creative-asset.html"
     ffmpeg -i raw.png -pix_fmt rgb24 ios/screenshots/creative-universal-5244x2950.png -->
<style>
html,body{margin:0;width:5244px;height:2950px;background:#0b1220;overflow:hidden;
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff}
.wrap{position:relative;width:5244px;height:2950px;
  background:radial-gradient(3600px 2000px at 18% 12%,#16233d 0%,#0b1220 62%)}
.grid{position:absolute;inset:0;background-size:240px 240px;
  background-image:linear-gradient(rgba(255,255,255,.035) 4px,transparent 4px),linear-gradient(90deg,rgba(255,255,255,.035) 4px,transparent 4px)}
.left{position:absolute;left:700px;top:620px;width:2150px}
.icon{width:400px;height:400px;border-radius:92px;overflow:hidden;box-shadow:0 60px 160px rgba(0,0,0,.6)}
.icon img{width:100%;height:100%;display:block}
.eyebrow{margin-top:110px;color:#e8c46a;font-size:66px;letter-spacing:.3em;font-weight:700}
h1{margin:40px 0 0;font-size:230px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 b{color:#e8c46a}
.sub{margin-top:70px;font-size:84px;line-height:1.3;color:#b9c6dc;font-weight:500}
.cards{position:absolute;left:3000px;top:620px;width:1700px;display:flex;flex-direction:column;gap:80px}
.card{background:#111c33;border:6px solid #2a3a5c;border-radius:64px;padding:70px 80px;box-shadow:0 50px 140px rgba(0,0,0,.45)}
.row{display:flex;align-items:center;gap:36px;font-size:62px;color:#8fa0bd;font-weight:600}
.chip{border-radius:999px;padding:14px 40px;font-size:54px;font-weight:800;letter-spacing:.08em}
.gold{background:#e8c46a;color:#0b1220}.red{background:#e5484d;color:#fff}.blue{background:#2a3a5c;color:#dfe7f5}
.big{margin-top:36px;font-size:112px;font-weight:800;letter-spacing:-.01em}
.big span{color:#8fa0bd;font-weight:600}
</style></head><body><div class="wrap"><div class="grid"></div>
<div class="left">
  <div class="icon"><img src="file:///Users/cv/projects/cfb-gameday/icons/icon-512.png"></div>
  <div class="eyebrow">EVERY FBS GAME</div>
  <h1>Kickoff weather<b>.</b><br>TV<b>.</b><br>Live scores<b>.</b></h1>
  <div class="sub">The whole college football slate,<br>Thursday to Saturday, on one screen.</div>
</div>
<div class="cards">
  <div class="card"><div class="row"><span class="chip gold">RAIN RISK</span>Sat 2:30 PM CT</div>
    <div class="big">&#x1F327;&#xFE0F; 62&deg; <span>&middot;</span> Wind 17 <span>&middot;</span> 67%</div></div>
  <div class="card"><div class="row"><span class="chip red">LIVE</span>3rd &middot; 8:42 &middot; 2nd &amp; 6</div>
    <div class="big">21 <span>&ndash;</span> 17 <span>&middot; updates every 30s</span></div></div>
  <div class="card"><div class="row"><span class="chip blue">TV</span>Every kickoff</div>
    <div class="big">Network <span>&amp;</span> streaming</div></div>
</div>
</div></body></html>
