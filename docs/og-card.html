<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;background:#0b1220;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden}
.wrap{position:relative;width:1200px;height:630px;background:radial-gradient(900px 500px at 15% 10%,#16233d 0%,#0b1220 60%)}

.sub{position:absolute;left:300px;top:222px;font-size:32px;color:#e8c46a;font-weight:600}
.chips{position:absolute;left:80px;top:326px;display:flex;gap:14px;flex-wrap:wrap;width:1040px}
.chip{border:2px solid #2a3a5c;background:#111c33;border-radius:999px;padding:12px 24px;font-size:24px;font-weight:600;color:#dfe7f5}
.chip.gold{background:#e8c46a;border-color:#e8c46a;color:#0b1220}
.foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;align-items:center;justify-content:space-between}

.badge{height:64px}
</style></head><body><div class="wrap"><div class="grid"></div>
