name: Checks

on:
  pull_request:
  push:
    branches: [nfl]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch main for the merge-base guard
        run: git fetch origin main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python3 scripts/check.py
      - run: python3 scripts/check_nfl.py
