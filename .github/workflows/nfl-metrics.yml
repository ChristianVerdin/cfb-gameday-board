name: Build NFL metrics

# Tue and Wed after the Monday night game settles. UTC, CST-written.
on:
  schedule:
    - cron: "0 14 * * 2"
    - cron: "0 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-metrics
  cancel-in-progress: false

jobs:
  metrics:
    if: github.event_name == 'workflow_dispatch' || vars.NFL_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build metrics
        run: |
          python3 scripts/nfl/build_metrics.py
          python3 scripts/check_nfl.py
      - name: Commit and push
        run: |
          if git diff --quiet -- nfl/metrics.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "gameday-bot"
          git config user.email "gameday-bot@users.noreply.github.com"
          git add nfl/metrics.json
          git commit -m "NFL metrics ($(date -u +%Y-%m-%dT%H:%MZ))"
          ok=0; for i in 1 2 3 4; do if git pull --rebase origin main && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; if [ "$i" -lt 4 ]; then sleep $((i*7)); fi; done; [ "$ok" = 1 ] || { echo "push failed after 4 attempts"; exit 1; }
