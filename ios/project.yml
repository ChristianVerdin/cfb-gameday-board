# XcodeGen spec. Regenerate the project with:  cd ios && xcodegen generate
# Never hand-edit CFBGameDay.xcodeproj; it is gitignored and disposable.
name: CFBGameDay
options:
  bundleIdPrefix: com.hoynelabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3V73W9NUZ6   # Hoyne Labs LLC; keeps signing across xcodegen regenerations
    TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad. iPad needs all four orientations and no UIRequiresFullScreen
                                         # (upload error 90474 otherwise); that same setup is what makes the Mac window resizable
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  CFBGameDay:
    type: application
    platform: iOS
    sources:
      - path: CFBGameDay
    dependencies:
      - target: CFBGameDayWidget        # embedded in PlugIns
    # Universal links (from 1.1): cfbgameday.app/#... opens the app; the site serves
    # .well-known/apple-app-site-association for this app id.
    entitlements:
      path: CFBGameDay/CFBGameDay.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:cfbgameday.app
    scheme:
      testTargets:
        - CFBGameDayTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoynelabs.cfbgameday
        PRODUCT_NAME: CFBGameDay
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
    info:
      path: CFBGameDay/Info.plist
      properties:
        CFBundleDisplayName: CFB GameDay
        CFBundleName: CFBGameDay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        # No UIRequiresFullScreen: deprecated in iPadOS 26, ignored for resizing from iOS 27 (TN3192),
        # and a full-screen app gets a fixed-size window on Mac.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Home Screen quick actions (long-press the icon), routed in QuickActions.swift.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.hoynelabs.cfbgameday.live
            UIApplicationShortcutItemTitle: Live Games
            UIApplicationShortcutItemSubtitle: Scores in progress
            UIApplicationShortcutItemIconSymbolName: dot.radiowaves.left.and.right
          - UIApplicationShortcutItemType: com.hoynelabs.cfbgameday.starred
            UIApplicationShortcutItemTitle: Starred
            UIApplicationShortcutItemSubtitle: Your games
            UIApplicationShortcutItemIconSymbolName: star
          - UIApplicationShortcutItemType: com.hoynelabs.cfbgameday.tv
            UIApplicationShortcutItemTitle: By TV
            UIApplicationShortcutItemSubtitle: Every game by network
            UIApplicationShortcutItemIconSymbolName: tv
          - UIApplicationShortcutItemType: com.hoynelabs.cfbgameday.rivalry
            UIApplicationShortcutItemTitle: Rivalry Games
            UIApplicationShortcutItemSubtitle: This week's trophy games
            UIApplicationShortcutItemIconSymbolName: trophy
        # cfbgameday://rivalry, ://live, ://starred, ://tv, ://board, ://game/<id>
        # (App Store in-app event deep links; routed in QuickActions.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.hoynelabs.cfbgameday
            CFBundleURLSchemes: [cfbgameday]
        # The one URL the app loads.
        BoardURL: https://cfbgameday.app
        BoardHost: cfbgameday.app

  # Home Screen and Lock Screen widget (from 1.1): the day's games from games.json + /api/live.
  CFBGameDayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CFBGameDayWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoynelabs.cfbgameday.widget
        PRODUCT_NAME: CFBGameDayWidget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CFBGameDayWidget/Info.plist
      properties:
        CFBundleDisplayName: CFB GameDay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Unit tests: routing, plus the widget's model and views compiled in directly.
  # TEST_RUNNER_SNAPSHOT_DIR=<dir> on xcodebuild test writes rendered widget previews there.
  CFBGameDayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CFBGameDayTests
        excludes:
          - Fixtures
      - path: CFBGameDayWidget/SlateModel.swift
      - path: CFBGameDayWidget/SlateViews.swift
    dependencies:
      - target: CFBGameDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoynelabs.cfbgameday.tests
        GENERATE_INFOPLIST_FILE: YES
