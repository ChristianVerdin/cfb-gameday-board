# XcodeGen spec. Regenerate the project with:  cd ios && xcodegen generate
# Never hand-edit CFBGameDay.xcodeproj; it is gitignored and disposable.
name: CFBGameDay
options:
  bundleIdPrefix: com.hoynelabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3V73W9NUZ6   # Hoyne Labs LLC; keeps signing across xcodegen regenerations
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only; "1,2" would trigger the iPad multitasking orientation rule at upload
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  CFBGameDay:
    type: application
    platform: iOS
    sources:
      - path: CFBGameDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoynelabs.cfbgameday
        PRODUCT_NAME: CFBGameDay
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
    info:
      path: CFBGameDay/Info.plist
      properties:
        CFBundleDisplayName: CFB GameDay
        CFBundleName: CFBGameDay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The one URL the app loads.
        BoardURL: https://cfbgameday.app
        BoardHost: cfbgameday.app
