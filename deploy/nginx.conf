# nginx alternative to the Caddyfile. TLS via certbot --nginx. Replace the host.
server {
    listen 80;
    server_name gameday.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name gameday.example.com;
    ssl_certificate     /etc/letsencrypt/live/gameday.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gameday.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/javascript application/json application/manifest+json text/css;

    # auth_basic "gameday"; auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
}
